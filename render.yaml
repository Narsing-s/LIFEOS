services:
  - type: web
    name: lifeos-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @lifeos/database prisma:generate && pnpm --filter @lifeos/api build
    preDeployCommand: pnpm --filter @lifeos/database exec prisma migrate deploy
    startCommand: pnpm --filter @lifeos/api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        value: https://lifeos-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://lifeos-api.onrender.com/api/v1/integrations/google/callback
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini

  - type: web
    runtime: static
    name: lifeos-web
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @lifeos/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lifeos-api.onrender.com/api/v1

databases:
  - name: lifeos-db
    plan: free
    region: singapore
    databaseName: lifeos
    user: lifeos
